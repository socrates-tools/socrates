name: Something it does not do
description: You want socrates to do something it does not
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: |
        A change here starts as a proposal in `openspec/`, not as code: see `CONTRIBUTING.md`.

        This issue is where that conversation starts. Read "What it deliberately is not" in `README.md` first: socrates reviews, and it does not land, verify, render, serve or wait for a person.
  - type: textarea
    id: achieving
    attributes:
      label: What you are trying to achieve
      description: The outcome, not the feature. The feature is what the proposal decides.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Why this is socrates' job
      description: Which of socrates' promises it belongs to, and why it is not landing, verifying, rendering, serving or waiting for a person.
    validations:
      required: true
