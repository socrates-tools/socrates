name: Something went wrong
description: socrates-review or agora did something you did not expect
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Not for a vulnerability: `SECURITY.md` has a private channel for that.

        The run's log quotes the change that was under review. Read it before you paste it.
  - type: input
    id: version
    attributes:
      label: What socrates-review version prints
      placeholder: socrates-review v0.1.0, built from 1798a6b
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 on arm64, or Ubuntu 24.04 under WSL
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you ran, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: What the run recorded
      description: The output of `socrates-review logs <run>`, where there is a run.
      render: text
