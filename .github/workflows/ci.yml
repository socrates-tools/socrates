name: verification

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platforms:
    runs-on: ubuntu-latest
    outputs:
      supported: ${{ steps.stated.outputs.supported }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the platforms socrates states it supports
        id: stated
        run: echo "supported=$(jq -c . platforms.json)" >> "$GITHUB_OUTPUT"

  verification:
    needs: platforms
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.supported) }}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: browser
        with:
          chrome-version: '152.0.7977.64'

      - name: Name the browser that drives the page
        run: |
          browser='${{ steps.browser.outputs.chrome-path }}'
          if [ ! -x "$browser" ]; then
            echo 'no browser was installed, and the surface page is driven by a real one' >&2
            exit 1
          fi
          "$browser" --version
          echo "AGORA_BROWSER=$browser" >> "$GITHUB_ENV"

      - name: Run every gate a contributor runs
        run: make verify

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: agora/web/.node-version

      - name: Check the committed bundle is what its source builds
        run: |
          corepack enable
          make assets
          git diff --exit-code -- agora/assets
