name: verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  platforms:
    runs-on: ubuntu-latest
    outputs:
      supported: ${{ steps.stated.outputs.supported }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the platforms socrates states it supports
        id: stated
        run: echo "supported=$(jq -c . platforms.json)" >> "$GITHUB_OUTPUT"

  verification:
    needs: platforms
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.supported) }}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Name the browser that drives the page
        run: |
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo 'no browser is installed, and the surface page is driven by a real one' >&2
            exit 1
          fi
          "$browser" --version
          echo "AGORA_BROWSER=$browser" >> "$GITHUB_ENV"

      - name: Run every gate a contributor runs
        run: make verify

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.node-version

      - name: Check the committed bundle is what its source builds
        run: |
          corepack enable
          make assets
          git diff --exit-code -- internal/assets
