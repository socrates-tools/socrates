schema: spec-driven

context: |
  socrates is a Go tool that puts an independent reviewer in front of unreviewed
  local changes. `openspec/` is the sole normative source for its design:
  `openspec/specs` for what is required and why, and the design documents of the
  archived changes for the decisions behind it. Nothing outside this repository
  is normative, and a reader who has only this repository has all of it.

  The binary is `socrates`, and `scrat` is a second name for it that `make
  install` puts beside it. The project is `socrates`. `agora` is a second and
  separate program in the same repository.

  ## What socrates is

  Your main coding session implements something. You now have unreviewed local
  changes. You run `socrates review`. socrates freezes the working tree into a
  commit nothing can move, spawns a detached reviewer session against that
  snapshot, and waits. The reviewer returns structured findings. Your main
  session, which still holds the whole implementation context, applies the
  patches or writes down why a finding is wrong. A fresh reviewer then judges the
  patches and the rebuttals together.

  The asymmetry is the whole design. The author has context and does the
  patching. The reviewer has independence and never authored anything.

  ## The scope rule

  **socrates reviews. It does not land, and it does not verify.**

  It finishes when the review is clean or when it escalates to the person.
  Committing, pushing, opening a pull request and watching CI are not socrates'
  and never become socrates'. Running the project's test or lint suite is not in
  the core layer: a later feature layer may add a configured verification
  command, and until it exists `clean` means `an independent reviewer found
  nothing blocking`, not `the tests pass`.

  This is mechanical rather than a judgement call about what is "close enough to
  review", because judgement calls erode. Four whole categories of machinery are
  deleted by it rather than trimmed, and each deletion is the reason a mechanism
  in `no-mistakes` has no counterpart here:

  - **The reviewer never writes.** Nothing but the person's own main session ever
    touches their working tree. There is no second writer, so force-push leases,
    rebase base resolution, bundled-local-base detection and branch custody
    recovery have nothing to protect against.
  - **No landing, no forge.** No push step, no pull request step, no CI step, no
    rerun or transient-check policy, and no provider adapter.
  - **No daemon.** One detached process per round and a directory of run state.
    No singleton lock, no IPC socket, no event ring, no SQLite, no crash
    recovery, no monotonic state revisions.
  - **No trust boundary.** Only the person whose machine this is can invoke it on
    their own repository, so there is no pinned trusted default-branch SHA and no
    trusted-versus-pushed field split. What socrates does read out of a reviewed
    repository it reads at the run's base commit, and that is not a defence
    against a stranger: it keeps the session that wrote the change from also
    writing the rules the change is judged by.

  ## Architecture, already decided

  - **One Go binary for the review**, `socrates`, built from `cmd/socrates` and
    installed under the second name `scrat`. cobra for the command surface. Go
    1.25 or later, because `testing/synctest` is stable there and the
    time-dependent parts are tested with it.
  - **Run state is a directory of files, not a database.** One directory per run
    under the user's state directory, holding one subdirectory per round, and a
    bounded JSONL event log. A file layout is inspectable with `ls` and `cat`
    when the tool itself is what is broken, which is exactly when a database is
    worst.
  - **The reviewer is a detached child process** on a frozen snapshot worktree.
    Every round spawns a new one, which is how socrates gets the cold-reviewer
    property for free: a process that exits cannot carry a prior round's
    conclusions into the next.
  - **One agent seam, one file per vendor behind it.** Every model call goes
    through a single narrow internal interface. Three implementations ship:
    `claude`, `codex` and `opencode`. The seam exists so the simulator can be
    substituted in tests, so a per-role model choice has one place to live, and
    so a person who runs a supported CLI other than the one socrates shipped with
    can be reviewed by it. It is not a plugin interface: a vendor is a CLI
    somebody read the documentation for, measured against the stated criteria,
    wrote a simulator for and recorded the shapes of.
  - **Per-role model and effort routing from the first commit.** The reviewer
    wants the strongest model available; nothing else in socrates does. A single
    global model setting is a decision the tool would have to unmake later.
  - **The reviewer reads the snapshot worktree, and the diff is inlined up to a
    byte ceiling.** Below the ceiling the common small change needs no
    exploration turns; above it the reviewer gets the changed-file list and reads
    for itself. One knob, honest at both ends.
  - **No TUI, no web portal, no multiplexer integration.** The reviewer writes a
    structured log and `socrates` is the only way to look at it. That keeps it
    portable to a plain terminal and to the VS Code integrated terminal by
    construction, and testable with no terminal at all.

  ## Load-bearing invariants

  Violating any of these is a correctness bug, not a style preference. Each is
  recorded in `no-mistakes` as the result of a real failure, filtered to the ones
  socrates can still hit.

  - **The snapshot includes untracked files.** `git stash create` silently
    ignores them, and a freshly implemented feature is mostly untracked files.
    The snapshot is built through a temporary index so it touches neither the
    person's index nor their working tree, and `git status` is byte-identical
    afterwards.
  - **The reviewer never writes, and it is enforced rather than intended.** A
    reviewer with write access to the snapshot worktree will eventually "just
    fix" something, and the next round's diff then contains changes nobody
    attributes.
  - **Empty is not green.** A review that returned no findings because it errored,
    and a findings file that never appeared, must never read as a pass. A clean
    verdict requires positive evidence that a review completed.
  - **A missing or empty `action` on a finding defaults to `ask-user`, never to
    `auto-fix`.** An unclassified finding is never silently patched. The check
    for whether any finding needs a person and the filter for which findings may
    be patched share one defaulting helper, because two that can disagree let a
    finding fall through the gap between them and be neither patched nor
    surfaced.
  - **Severity and action are orthogonal.** Severity decides whether the run
    blocks; action decides who resolves it. An `info` finding actioned `auto-fix`
    is patched without ever blocking, and an `error` actioned `ask-user` reaches
    the person and is never handed to a patching agent.
  - **The reviewer never receives the author's rationale.** It gets the diff, the
    repository and the person's stated intent. The one exception is explicit: a
    later round receives the prior findings and the written rebuttals, labelled
    as claims to be judged.
  - **Prior findings, fix summaries and rebuttals are claims, not evidence**, and
    a test written in the same round as the code it exercises is part of the
    claim.
  - **Every child process is reaped by process group.** Workers the reviewer
    spawned escape the group, hold the snapshot worktree, and accumulate until
    the operating system kills something. The group is set on spawn and killed on
    clean exit and on error, not only on cancel.
  - **A re-entrancy marker is set in the reviewer's environment.** The reviewer
    is a coding session reading a repository whose own agent instructions may
    tell it to run socrates, and the failure without a marker is recursive
    spawning.
  - **Model output is neutralised before it is re-embedded in a prompt.** Conflict
    markers are removed, line endings normalised and whitespace runs collapsed,
    per field rather than across the blob. socrates has two such channels where
    `no-mistakes` has one, so this matters more here rather than less.

  ## Testing

  The weighting is charon's, and it is deliberate rather than a compromise.

  - **Local end to end is the primary suite.** A run drives the real `socrates`
    binary against a real temporary git repository, doing real snapshotting, real
    process spawning and real file layout. Exactly three things are substituted:
    the coding agent (a simulator binary), the clock (`testing/synctest`) and
    nothing else.
  - **The agent is the one third party outside our control, so we simulate it.**
    `cmd/claudesim`, `cmd/codexsim` and `cmd/opencodesim` each speak their
    vendor's wire contract and are symlinked under that vendor's name into a
    temporary PATH directory. They read the same vendor-neutral scenario files
    and append to the same invocation log, so a test can assert what was asked as
    well as what came back. A simulator produces on demand what the real tool
    produces rarely: a truncated stream, a schema violation, a non-zero exit
    after partial output, a process that writes nothing and never returns.
  - **The simulator's fidelity is itself tested, and that check matters more than
    test count.** Responses are recorded from each real CLI behind a build tag,
    a scheduled job re-records and diffs them, and a non-empty diff means that
    CLI changed. A green suite against a simulator that no longer
    resembles the real tool is worse than no suite, because it manufactures
    confidence.
  - **A separate live smoke suite asks a different question:** whether each real
    CLI still accepts the arguments socrates passes and still returns a document
    that satisfies the schema. No recording can answer that. It is behind its own
    build tag, so the ordinary suite compiles none of it.
  - **Model judgement is evaluated, never asserted in CI.** Whether a prompt
    finds a given bug is a development-time evaluation. A CI test may assert the
    exact prompt socrates emits, as an intentional generated interface, and may
    never assert what a model concluded from it.
  - **Unit tests are not a general practice.** They are written exhaustively for
    the pure cores with a large input space and an expensive wrong answer: the
    finding classification and defaulting predicate, the prompt sanitiser, the
    round and terminality decision, and the exit-code mapping. Everywhere else,
    prefer the end-to-end test.
  - **Time is tested with `testing/synctest`**, never with real sleeps and never
    by threading a clock through constructors.
  - **`google/go-cmp` is the only assertion helper.** No testify.
  - **CLI behaviour is tested with `rogpeppe/go-internal/testscript`** as txtar
    scripts, not with Go code driving a subprocess.
  - **The release metric is scenario coverage, not line coverage.** Every test is
    named after the specification scenario it covers, so an uncovered scenario is
    visible mechanically. Line coverage cannot see a finding that fell through
    the gap between two defaulting rules, and that is the bug class that actually
    occurs here.
  - **Bug fixes start by reproducing the bug end to end**, at the layer a person
    would meet it.

  ## Conventions

  - **Write no comments.** Not few, not only where necessary, none. A name that
    needs a sentence beside it is the wrong name; reasoning about a change
    belongs in its commit message; a constraint somebody would otherwise
    re-derive belongs in `docs/gotchas.md`; a decision belongs in `openspec/`.
    The exemptions are the directives a tool parses and the scenario markers the
    coverage script reads.
  - **Never use an em dash** in any prose, document, commit message or emitted
    string. Use a plain dash.
  - In long Markdown, put each full sentence on its own line.
  - Prefer quality, simplicity, robustness and long-term maintainability over
    development cost.
  - `make lint test` must pass after **every** task, not only at the end of a
    group. The ordering rule inside each `tasks.md` exists to make that possible.

  ## The layers, in order

  Each layer is one change, and each stands on the one before it. A change that
  reaches forward into a later layer, or that needs something from a layer not
  yet built, is in the wrong place.

  1. `a-review-nobody-authored`: the core. Freeze, review, findings, verdict, one
     round. Nothing to argue with and nothing to follow.
  2. `one-window-three-needs`: presentation on the core's structured log. `watch`
     and `logs`, and the boundary between them and `status`.
  3. `a-rejection-is-a-claim`: the dialogue on the core. Rounds, written
     rebuttals, the round cap, and what escalates immediately.
  4. `the-loop-an-agent-can-drive`: the skill on the dialogue. The generated
     `/socrates` skill that teaches a session the loop layer 3 made possible.

  Layers 2 and 3 are independent of each other and both depend on 1. Layer 4
  depends on 3.

  ## What is deliberately deferred

  These are real and wanted, and none of them is in the first layers. Each is
  written down so that a change proposing one is recognised as reaching the
  roadmap rather than inventing scope.

  - **A verification command.** socrates running the project's own tests against
    the snapshot, so that `clean` means more. It is a feature layer on the core,
    and it brings a trust question about where the command comes from.
  - **A pre-push hook.** A slash command is cooperative and can be forgotten. The
    same reviewer wired to a hook restores enforcement without changing anything
    below it, which is why it is deferred rather than foreclosed.
  - **A second agent implementation.** One new file behind the existing seam.
