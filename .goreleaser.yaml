version: 2

project_name: socrates-review

builds:
  - id: socrates-review
    main: ./review/cmd/socrates-review
    binary: socrates-review
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -X github.com/socrates-tools/socrates/internal/version.version={{ if .IsSnapshot }}{{ else }}{{ .Tag }}{{ end }}
      - -X github.com/socrates-tools/socrates/internal/version.commit={{ .ShortCommit }}

  - id: agora
    main: ./agora/cmd/agora
    binary: agora
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -X github.com/socrates-tools/socrates/internal/version.version={{ if .IsSnapshot }}{{ else }}{{ .Tag }}{{ end }}
      - -X github.com/socrates-tools/socrates/internal/version.commit={{ .ShortCommit }}

archives:
  - id: socrates-review
    ids:
      - socrates-review
      - agora
    formats:
      - tar.gz
    name_template: socrates-review_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - src: LICENSE
      - src: NOTICE

checksum:
  name_template: checksums.txt

sboms:
  - id: archives
    artifacts: archive

signs:
  - id: checksums
    cmd: cosign
    signature: ${artifact}.bundle
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    artifacts: checksum
    output: true

snapshot:
  version_template: '{{ .ShortCommit }}-snapshot'

changelog:
  disable: true

release:
  draft: false
  prerelease: auto
  footer: |
    Verify a download against this repository without trusting whoever pushed the tag:

    ```sh
    sha256sum --check --ignore-missing checksums.txt
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.bundle \
      --certificate-identity-regexp 'https://github.com/socrates-tools/socrates-review/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    gh attestation verify socrates-review_*.tar.gz --repo socrates-tools/socrates-review
    ```
