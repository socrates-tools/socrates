<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../../assets/brand/favicon.svg">
<title>socrates · review page</title>
<link rel="stylesheet" href="../../styles.css">
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../assets/dev/preview-fallback.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="Rail.jsx"></script>
<script type="text/babel" src="SettledPanel.jsx"></script>
<script type="text/babel" src="DecisionCard.jsx"></script>
<script type="text/babel" src="Composer.jsx"></script>
<script type="text/babel" src="ReviewPage.jsx"></script>
<script type="text/babel">
function Kit() {
  const [state, setState] = React.useState('open');
  const [settled, setSettled] = React.useState(true);
  const btn = (on) => ({ height: 28, padding: '0 12px', border: 0, borderRadius: 999, background: on ? 'var(--ink-900)' : 'transparent', color: on ? '#fff' : 'var(--fg-2)', font: '700 12px var(--font-body)', cursor: 'pointer' });
  return (<>
    <ReviewPage data={window.SO_DATA} initial={state} showSettled={settled} />
    <div style={{ position: 'fixed', right: 16, bottom: 16, zIndex: 40, display: 'flex', gap: 4, padding: 4, borderRadius: 999, background: '#fff', border: '1px solid var(--border)', boxShadow: 'var(--shadow-card)' }}>
      {['open', 'over', 'nothing'].map(s => <button key={s} style={btn(state === s)} onClick={() => setState(s)}>{s === 'open' ? 'Open' : s === 'over' ? 'Over' : 'Nothing'}</button>)}
      <button style={btn(settled)} onClick={() => setSettled(v => !v)}>Settled</button>
    </div>
  </>);
}
window.__soReady.then(NS => { window.SO = NS; ReactDOM.createRoot(document.getElementById('root')).render(<Kit />); });
</script>
</body></html>
