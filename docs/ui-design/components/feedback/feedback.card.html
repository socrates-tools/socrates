<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg-page);} .lbl{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);margin-bottom:8px;} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;} .stack{display:flex;flex-direction:column;gap:20px;}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../assets/dev/preview-fallback.js"></script>
<script type="text/babel">
window.__soReady.then(NS => {
const { Dialog, Tooltip, Button, Mark } = NS;
function Demo() {
  return (<div style={{display:'flex',gap:32,alignItems:'flex-start'}}>
    <Dialog inline title="1 decision is blank" actions={<><Button variant="ghost">Go back and answer</Button><Button>Send anyway</Button></>}>A decision left blank goes as nothing. Whoever asked will see no answer to it.</Dialog>
    <div style={{paddingTop:120}}><Tooltip open title="Severity: Error" hint="Likely wrong; the change should not land as it is."><Mark value="error" /></Tooltip></div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script></body></html>
