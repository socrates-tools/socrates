<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg-page);} .lbl{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);margin-bottom:8px;} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;} .stack{display:flex;flex-direction:column;gap:20px;}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>

<script type="text/babel">
window.__soReady.then(NS => {
const { Card, CardSection, Notice, Mark, Check } = NS;
function Demo() {
  return (<div className="stack" style={{gap:16}}>
    <Card>
      <CardSection style={{gap:12}}>
        <div className="row" style={{gap:8}}><span style={{fontFamily:'var(--font-mono)',fontSize:12,fontWeight:600,color:'var(--fg-3)'}}>01</span><span style={{fontSize:14,fontWeight:700}}>Finding 1</span><Mark value="error" /><Mark value="needs a person" /></div>
        <h2 style={{margin:0,fontSize:22,lineHeight:1.3,letterSpacing:'-0.01em'}}>should the cache be read before the lock is taken</h2>
      </CardSection>
      <CardSection tone="sunk" divided><span style={{color:'var(--fg-2)',fontSize:14}}>Answering band — options and text area go here.</span></CardSection>
    </Card>
    <Notice tone="resolved" title="Sent. Here is what went:"><span>Finding 1: take the lock first</span><span>Waiting for a reply on this page.</span></Notice>
    <Notice title="The exchange is over. Nothing further will be sent from this page." />
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script></body></html>
