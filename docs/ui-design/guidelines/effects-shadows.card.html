<!-- @dsCard group="Effects" viewport="700x160" name="Shadows & rings" subtitle="Card, dialog, CTA, focus, selected" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg-page);font-family:var(--font-body);color:var(--fg-1);}
.row{display:flex;flex-wrap:wrap;gap:12px;} .sw{width:96px;display:flex;flex-direction:column;gap:6px;} .chip{height:64px;border-radius:12px;border:1px solid var(--border);}
.n{font-size:12px;font-weight:700;} .v{font-family:var(--font-mono);font-size:12px;color:var(--fg-3);} </style></head><body><div class="row" style="gap:20px"><div class="sw" style="width:104px"><div style="height:72px;border-radius:12px;background:#fff;box-shadow:var(--shadow-card);border:1px solid var(--border)"></div><span class="n">card</span></div><div class="sw" style="width:104px"><div style="height:72px;border-radius:12px;background:#fff;box-shadow:var(--shadow-dialog)"></div><span class="n">dialog</span></div><div class="sw" style="width:104px"><div style="height:72px;border-radius:12px;background:#fff;box-shadow:var(--shadow-cta);background:var(--accent)!important"></div><span class="n">cta</span></div><div class="sw" style="width:104px"><div style="height:72px;border-radius:12px;background:#fff;box-shadow:var(--ring-focus);border:1px solid var(--accent)"></div><span class="n">focus</span></div><div class="sw" style="width:104px"><div style="height:72px;border-radius:12px;background:#fff;box-shadow:var(--ring-selected);border:1px solid var(--accent);background:var(--accent-selected)!important"></div><span class="n">selected</span></div></div></body></html>
