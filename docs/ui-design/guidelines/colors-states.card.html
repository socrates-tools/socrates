<!-- @dsCard group="Colors" viewport="700x150" name="States" subtitle="Severity, resolved, neutral - ink on wash" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg-page);font-family:var(--font-body);color:var(--fg-1);}
.row{display:flex;flex-wrap:wrap;gap:12px;} .sw{width:96px;display:flex;flex-direction:column;gap:6px;} .chip{height:64px;border-radius:12px;border:1px solid var(--border);}
.n{font-size:12px;font-weight:700;} .v{font-family:var(--font-mono);font-size:12px;color:var(--fg-3);} </style></head><body><div class="row"><div class="sw" style="width:150px"><div class="chip" style="background:var(--state-error-wash);border:0;display:flex;align-items:center;justify-content:center;color:var(--state-error);font-weight:700;">Error</div><span class="v">#B42E24 / #FBE6E3</span></div><div class="sw" style="width:150px"><div class="chip" style="background:var(--state-warning-wash);border:0;display:flex;align-items:center;justify-content:center;color:var(--state-warning);font-weight:700;">Warning</div><span class="v">#8A5A00 / #FAEFD8</span></div><div class="sw" style="width:150px"><div class="chip" style="background:var(--state-resolved-wash);border:0;display:flex;align-items:center;justify-content:center;color:var(--state-resolved);font-weight:700;">Resolved</div><span class="v">#4F6B25 / #EBF0DF</span></div><div class="sw" style="width:150px"><div class="chip" style="background:var(--state-neutral-wash);border:0;display:flex;align-items:center;justify-content:center;color:var(--state-neutral);font-weight:700;">Neutral</div><span class="v">#4B5B6B / #F0EBE1</span></div></div></body></html>
