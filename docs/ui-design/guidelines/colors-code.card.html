<!-- @dsCard group="Colors" viewport="700x200" name="Code & diff" subtitle="Syntax tokens and diff rows on light ground" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg-page);font-family:var(--font-body);color:var(--fg-1);}
.row{display:flex;flex-wrap:wrap;gap:12px;} .sw{width:96px;display:flex;flex-direction:column;gap:6px;} .chip{height:64px;border-radius:12px;border:1px solid var(--border);}
.n{font-size:12px;font-weight:700;} .v{font-family:var(--font-mono);font-size:12px;color:var(--fg-3);} </style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
<pre style="margin:0;padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface-sunk);font-size:13px;line-height:1.7;"><span style="color:var(--token-keyword);font-weight:600">func</span> <span style="color:var(--token-call)">Write</span><span style="color:var(--token-punct)">(</span>key <span style="color:var(--token-type)">string</span><span style="color:var(--token-punct)">)</span> <span style="color:var(--token-punct)">{</span>
  n <span style="color:var(--token-punct)">:=</span> <span style="color:var(--token-number)">42</span>
  s <span style="color:var(--token-punct)">:=</span> <span style="color:var(--token-string)">"entry"</span>
  <span style="color:var(--token-comment);font-style:italic">// one line per write</span>
<span style="color:var(--token-punct)">}</span></pre>
<div style="border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;font-family:var(--font-mono);font-size:13px;line-height:1.7;padding:8px 0;">
<div style="display:grid;grid-template-columns:40px 1fr;"><span style="text-align:right;padding-right:10px;background:var(--diff-removed-gutter);color:var(--fg-2)">11</span><span style="background:var(--diff-removed);padding-left:8px"><span style="color:var(--diff-removed-mark)">- </span>store[key] = entry</span></div>
<div style="display:grid;grid-template-columns:40px 1fr;"><span style="text-align:right;padding-right:10px;background:var(--diff-added-gutter);color:var(--fg-2)">11</span><span style="background:var(--diff-added);padding-left:8px"><span style="color:var(--diff-added-mark)">+ </span>mu.Lock()</span></div>
<div style="display:grid;grid-template-columns:40px 1fr;"><span style="background:var(--diff-absent)"></span><span style="background:var(--diff-absent)">&nbsp;</span></div>
<div style="display:grid;grid-template-columns:40px 1fr;"><span style="text-align:right;padding-right:10px;color:var(--diff-number)">12</span><span style="padding-left:8px">  }</span></div>
</div></div></body></html>
