document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg>GitHub<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"top\" style=\"padding-top:57px;\">\n\n<section data-screen-label=\"Hero\" style=\"max-width:1200px;margin:0 auto;padding:clamp(56px,12vw,88px) 20px clamp(56px,12vw,96px);\">\n  <div style=\"display:flex;flex-direction:column;gap:20px;max-width:760px;\">\n    <sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"339d8a75-a2c4-4f32-815e-ff8679647be6\" width=\"72\" height=\"72\" alt=\"socrates\" style=\"display:block;border-radius:17px;margin-bottom:4px;box-shadow:0 1px 2px rgba(20,40,60,0.06),0 16px 32px -12px rgba(18,89,168,0.35);\"><\u002Fsc-if>\n    <h1 style=\"margin:0;font-size:clamp(30px,7vw,44px);line-height:1.15;font-weight:700;letter-spacing:-0.025em;text-wrap:balance;\">A workflow for delivering features with AI, from first idea to reviewed branch.<\u002Fh1>\n    <p style=\"margin:0;font-size:16px;line-height:1.6;color:#3D4D5E;max-width:600px;text-wrap:pretty;\">socrates takes your coding session through design, tickets, implementation and review. When it needs you, it opens a clear, interactive page in your browser instead of printing walls of markdown in the terminal.<\u002Fp>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;padding-top:4px;\">\n      <a href=\"#install\" style=\"display:inline-flex;align-items:center;height:40px;padding:0 20px;border-radius:999px;background:#1259A8;color:#FFFFFF;font-size:14px;font-weight:700;box-shadow:0 6px 16px -6px rgba(18,89,168,0.5);\" style-hover=\"background:#0E4A8C;color:#FFFFFF;\">Install socrates<\u002Fa>\n      <a href=\"#workflow\" style=\"display:inline-flex;align-items:center;height:40px;padding:0 20px;border-radius:999px;border:1px solid #D6CDBD;background:#FFFFFF;color:#14283C;font-size:14px;font-weight:700;\" style-hover=\"border-color:#1259A8;color:#1259A8;\">See the workflow<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"what\" data-screen-label=\"What it does\" style=\"border-top:1px solid #E5DED1;background:#FFFFFF;\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(48px,10vw,80px) 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;\">\n    <sc-if value=\"{{ wide }}\" hint-placeholder-val=\"{{ true }}\"><img src=\"339d8a75-a2c4-4f32-815e-ff8679647be6\" width=\"96\" height=\"96\" alt=\"socrates\" style=\"display:block;border-radius:22px;margin-bottom:20px;box-shadow:0 1px 2px rgba(20,40,60,0.06),0 16px 32px -12px rgba(18,89,168,0.35);\"><\u002Fsc-if>\n    <span style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;color:#66727F;\">WHY IT WAS BUILT<\u002Fspan>\n    <h2 style=\"margin:0;font-size:clamp(22px,5vw,28px);line-height:1.25;font-weight:700;letter-spacing:-0.02em;max-width:720px;text-wrap:balance;\">Humans and AI understanding each other before work starts<\u002Fh2>\n    <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3D4D5E;max-width:640px;text-wrap:pretty;\">socrates exists so that people and AI reach a shared understanding before any work begins, rather than handing tasks over blindly. The <code>socrates-design<\u002Fcode> skill, for instance, settles every open question with you before a single line of the spec is written.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"inspired\" data-screen-label=\"Inspired by\" style=\"border-top:1px solid #E5DED1;\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(48px,10vw,64px) 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;\">\n    <span style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;color:#66727F;\">INSPIRED BY<\u002Fspan>\n    <h2 style=\"margin:0;font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-0.015em;\">Two projects that inspired socrates<\u002Fh2>\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:16px;width:100%;\">\n      <a href=\"https://github.com/kunchenguid/lavish-axi\" style=\"flex:1 1 260px;max-width:360px;padding:20px 24px;border:1px solid #E5DED1;border-radius:12px;background:#FFFFFF;box-shadow:0 1px 2px rgba(20,40,60,0.04),0 12px 32px -12px rgba(20,40,60,0.10);display:flex;justify-content:space-between;align-items:center;gap:16px;color:#14283C;text-align:left;transition:border-color 160ms cubic-bezier(0.2,0,0,1);\" style-hover=\"border-color:#1259A8;color:#14283C;\">\n        <span style=\"display:flex;flex-direction:column;gap:2px;\"><span style=\"font-size:16px;font-weight:700;\">lavish<\u002Fspan><code style=\"font-size:12.5px;color:#66727F;\">kunchenguid/lavish-axi<\u002Fcode><\u002Fspan>\n        <span style=\"font-size:16px;color:#1259A8;\">→<\u002Fspan>\n      <\u002Fa>\n      <a href=\"https://github.com/mattpocock/skills\" style=\"flex:1 1 260px;max-width:360px;padding:20px 24px;border:1px solid #E5DED1;border-radius:12px;background:#FFFFFF;box-shadow:0 1px 2px rgba(20,40,60,0.04),0 12px 32px -12px rgba(20,40,60,0.10);display:flex;justify-content:space-between;align-items:center;gap:16px;color:#14283C;text-align:left;transition:border-color 160ms cubic-bezier(0.2,0,0,1);\" style-hover=\"border-color:#1259A8;color:#14283C;\">\n        <span style=\"display:flex;flex-direction:column;gap:2px;\"><span style=\"font-size:16px;font-weight:700;\">grill<\u002Fspan><code style=\"font-size:12.5px;color:#66727F;\">mattpocock/skills<\u002Fcode><\u002Fspan>\n        <span style=\"font-size:16px;color:#1259A8;\">→<\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"workflow\" data-screen-label=\"Workflow\" style=\"border-top:1px solid #E5DED1;\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(48px,10vw,80px) 20px;display:flex;flex-direction:column;gap:40px;\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;max-width:640px;\">\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;color:#66727F;\">THE WORKFLOW<\u002Fspan>\n      <h2 style=\"margin:0;font-size:clamp(22px,5vw,28px);line-height:1.25;font-weight:700;letter-spacing:-0.02em;\">From an idea to a reviewed branch<\u002Fh2>\n      <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3D4D5E;text-wrap:pretty;\">You work through four skills in your coding session. Use all four for a new feature, or go straight to review for a change you already have.<\u002Fp>\n    <\u002Fdiv>\n\n    <ol style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;\">\n      <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <li style=\"padding:24px;border:1px solid #E5DED1;border-radius:12px;background:#FFFFFF;box-shadow:0 1px 2px rgba(20,40,60,0.04),0 12px 32px -12px rgba(20,40,60,0.10);display:flex;flex-direction:column;gap:12px;\">\n          <div style=\"display:flex;flex-direction:column;gap:4px;\">\n            <h3 style=\"margin:0;font-size:18px;font-weight:700;letter-spacing:-0.01em;\">{{ s.title }}<\u002Fh3>\n            <code style=\"font-size:12.5px;font-weight:600;color:#1259A8;\">{{ s.skill }}<\u002Fcode>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13px;font-weight:700;color:#A3471F;\">{{ s.when }}<\u002Fp>\n          <p style=\"margin:0;font-size:14px;line-height:1.6;color:#3D4D5E;text-wrap:pretty;\">{{ s.body }}<\u002Fp>\n        <\u002Fli>\n      <\u002Fsc-for>\n    <\u002Fol>\n\n    <sc-if value=\"{{ showPreview }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:40px;align-items:center;padding-top:24px;\">\n      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n        <span style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;color:#66727F;\">THE DECISIONS PAGE<\u002Fspan>\n        <h3 style=\"margin:0;font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-0.015em;text-wrap:balance;\">Decisions on a page, not walls of markdown in a terminal<\u002Fh3>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#3D4D5E;text-wrap:pretty;\">When a skill needs your input, socrates opens a page in your browser. Each question shows its options and what each one means, with the recommended choice marked. You click to answer, and your session picks it up from there.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E5DED1;border-radius:12px;background:#F6F2EA;box-shadow:0 1px 2px rgba(20,40,60,0.04),0 24px 48px -20px rgba(20,40,60,0.18);overflow:hidden;min-width:0;\">\n        <div style=\"height:44px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #E5DED1;\">\n          <span style=\"display:flex;align-items:center;gap:8px;\"><img src=\"339d8a75-a2c4-4f32-815e-ff8679647be6\" width=\"22\" height=\"22\" alt=\"\" style=\"display:block;border-radius:6px;\"><span style=\"font-family:'Cinzel',Georgia,serif;font-size:13px;font-weight:700;letter-spacing:0.12em;\">socrates<\u002Fspan><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:999px;background:#EEF4FB;color:#1259A8;font-size:12px;font-weight:700;\"><span style=\"width:6px;height:6px;border-radius:50%;background:currentColor;\"><\u002Fspan>Open<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:16px;display:flex;flex-direction:column;gap:12px;\">\n          <div style=\"background:#FFFFFF;border:1px solid #E5DED1;border-radius:12px;overflow:hidden;\">\n            <div style=\"padding:16px 20px;display:flex;flex-direction:column;gap:10px;\">\n              <div style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap;\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5F6B78;\">01<\u002Fspan>\n                <span style=\"font-size:13px;font-weight:700;margin-right:4px;\">Finding 1<\u002Fspan>\n                <span style=\"height:22px;padding:0 8px 0 6px;display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:#FAEFD8;color:#8A5A00;font-size:12px;font-weight:700;\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>Warning<\u002Fspan>\n                <span style=\"height:22px;padding:0 8px 0 6px;display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:#E8F0FA;color:#1259A8;font-size:12px;font-weight:700;\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"12\" cy=\"7\" r=\"4\"><\u002Fcircle><\u002Fsvg>Your call<\u002Fspan>\n                <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:#5F6B78;\">cmd/flags.go:15<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.35;\">keep the old flag for one release, or remove it now?<\u002Fspan>\n              <span style=\"font-size:13px;color:#4B5B6B;\">scripts that still pass --legacy-cache will fail to start.<\u002Fspan>\n              <div style=\"border:1px solid #E5DED1;border-radius:10px;overflow:hidden;\">\n                <div style=\"height:32px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #E5DED1;background:#F3EEE4;font-family:'JetBrains Mono',monospace;font-size:12px;\">\n                  <span style=\"font-weight:600;\">cmd/flags.go<\u002Fspan>\n                  <span style=\"display:flex;gap:10px;font-weight:700;\"><span style=\"color:#4F6B25;\">+1<\u002Fspan><span style=\"color:#B42E24;\">-1<\u002Fspan><\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"overflow-x:auto;background:#FFFFFF;\">\n                  <div style=\"display:grid;grid-template-columns:32px 32px minmax(max-content,1fr);font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.75;white-space:pre;color:#14283C;padding:6px 0;\">\n<span style=\"padding:0 6px;text-align:right;color:#8A939D;background:transparent;\">14<\u002Fspan><span style=\"padding:0 6px;text-align:right;color:#8A939D;background:transparent;\">14<\u002Fspan><span style=\"background:transparent;padding-right:12px;\"><span style=\"display:inline-block;width:2ch;color:#8A939D;\"> <\u002Fspan><span style=\"color:#1259A8;\">func<\u002Fspan> <span style=\"color:#B4532D;\">registerFlags<\u002Fspan><span style=\"color:#66727F;\">(<\u002Fspan>fs <span style=\"color:#66727F;\">*<\u002Fspan><span style=\"color:#0B6E79;\">flag.FlagSet<\u002Fspan><span style=\"color:#66727F;\">) {<\u002Fspan><\u002Fspan>\n<span style=\"padding:0 6px;text-align:right;color:#4B5B6B;background:#FBE6E3;\">15<\u002Fspan><span style=\"padding:0 6px;text-align:right;color:#4B5B6B;background:#FBE6E3;\"><\u002Fspan><span style=\"background:#FDF1EF;padding-right:12px;\"><span style=\"display:inline-block;width:2ch;color:#B42E24;\">-<\u002Fspan>  fs.<span style=\"color:#B4532D;\">BoolVar<\u002Fspan><span style=\"color:#66727F;\">(&amp;<\u002Fspan>cfg.Legacy<span style=\"color:#66727F;\">,<\u002Fspan> <span style=\"color:#4F6B25;\">\"legacy-cache\"<\u002Fspan><span style=\"color:#66727F;\">,<\u002Fspan> <span style=\"color:#1259A8;\">false<\u002Fspan><span style=\"color:#66727F;\">,<\u002Fspan> <span style=\"color:#4F6B25;\">\"use the old cache\"<\u002Fspan><span style=\"color:#66727F;\">)<\u002Fspan><\u002Fspan>\n<span style=\"padding:0 6px;text-align:right;color:#4B5B6B;background:#E4EDD5;\"><\u002Fspan><span style=\"padding:0 6px;text-align:right;color:#4B5B6B;background:#E4EDD5;\">15<\u002Fspan><span style=\"background:#F0F5E8;padding-right:12px;\"><span style=\"display:inline-block;width:2ch;color:#4F6B25;\">+<\u002Fspan>  fs.<span style=\"color:#B4532D;\">IntVar<\u002Fspan><span style=\"color:#66727F;\">(&amp;<\u002Fspan>cfg.CacheSize<span style=\"color:#66727F;\">,<\u002Fspan> <span style=\"color:#4F6B25;\">\"cache-size\"<\u002Fspan><span style=\"color:#66727F;\">,<\u002Fspan> <span style=\"color:#8A5A00;\">1000<\u002Fspan><span style=\"color:#66727F;\">,<\u002Fspan> <span style=\"color:#4F6B25;\">\"entries to keep\"<\u002Fspan><span style=\"color:#66727F;\">)<\u002Fspan><\u002Fspan>\n<span style=\"padding:0 6px;text-align:right;color:#8A939D;background:transparent;\">16<\u002Fspan><span style=\"padding:0 6px;text-align:right;color:#8A939D;background:transparent;\">16<\u002Fspan><span style=\"background:transparent;padding-right:12px;\"><span style=\"display:inline-block;width:2ch;color:#8A939D;\"> <\u002Fspan><span style=\"color:#66727F;\">}<\u002Fspan><\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:16px 20px;background:#FBF9F5;border-top:1px solid #E5DED1;display:flex;flex-direction:column;gap:8px;\">\n              <sc-for list=\"{{ previewOptions }}\" as=\"o\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ o.pick }}\" style=\"all:unset;cursor:pointer;display:grid;grid-template-columns:18px minmax(0,1fr) auto;column-gap:12px;row-gap:2px;align-items:start;padding:12px 16px;border-radius:12px;background:{{ o.bg }};border:1px solid {{ o.border }};box-shadow:{{ o.ring }};transition:border-color 160ms cubic-bezier(0.2,0,0,1);\">\n                  <span style=\"grid-row:1 / span 2;margin-top:2px;width:18px;height:18px;border-radius:50%;border:{{ o.radio }};background:#FFFFFF;box-sizing:border-box;\"><\u002Fspan>\n                  <span style=\"grid-column:2;font-size:14px;font-weight:700;line-height:1.5;\">{{ o.label }}<\u002Fspan>\n                  <sc-if value=\"{{ o.rec }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"grid-column:3;grid-row:1;align-self:center;height:22px;padding:0 8px;display:inline-flex;align-items:center;border-radius:999px;background:#E2F0F1;color:#0B6E79;font-size:12px;font-weight:700;\">Recommended<\u002Fspan>\n                  <\u002Fsc-if>\n                  <span style=\"grid-column:2 / span 2;font-size:13px;line-height:1.5;color:#4B5B6B;\">{{ o.meaning }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <div style=\"display:flex;justify-content:flex-end;padding-top:4px;\">\n                <span style=\"display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:999px;background:#1259A8;color:#FFFFFF;font-size:13px;font-weight:700;\">Send and wait for a reply<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    \n  <\u002Fdiv>\n<\u002Fsc-if><\u002Fdiv><\u002Fsection>\n\n<section id=\"install\" data-screen-label=\"Install\" style=\"border-top:1px solid #E5DED1;background:#FFFFFF;\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(48px,10vw,80px) 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:48px;align-items:start;\">\n    <div style=\"display:flex;flex-direction:column;gap:20px;\">\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;color:#66727F;\">INSTALL<\u002Fspan>\n      <h2 style=\"margin:0;font-size:clamp(22px,5vw,28px);line-height:1.25;font-weight:700;letter-spacing:-0.02em;\">What it needs<\u002Fh2>\n      <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;border-top:1px solid #E5DED1;\">\n        <li style=\"padding:12px 0;border-bottom:1px solid #E5DED1;display:flex;flex-direction:column;gap:2px;\"><span style=\"font-size:14px;font-weight:700;\">Claude Code<\u002Fspan><span style=\"font-size:13px;color:#3D4D5E;\">It runs the skills. Codex support is coming.<\u002Fspan><\u002Fli>\n        <li style=\"padding:12px 0;border-bottom:1px solid #E5DED1;display:flex;flex-direction:column;gap:2px;\"><span style=\"font-size:14px;font-weight:700;\">For review, <code>claude<\u002Fcode>, <code>codex<\u002Fcode> or <code>opencode<\u002Fcode> on your <code>PATH<\u002Fcode><\u002Fspan><span style=\"font-size:13px;color:#3D4D5E;\">Signed in to an account. socrates is free, but every review is a model call billed to that account.<\u002Fspan><\u002Fli>\n        <li style=\"padding:12px 0;border-bottom:1px solid #E5DED1;display:flex;flex-direction:column;gap:2px;\"><span style=\"font-size:14px;font-weight:700;\">Linux or macOS<\u002Fspan><span style=\"font-size:13px;color:#3D4D5E;\">On Windows, use WSL.<\u002Fspan><\u002Fli>\n        <li style=\"padding:12px 0;border-bottom:1px solid #E5DED1;display:flex;flex-direction:column;gap:2px;\"><span style=\"font-size:14px;font-weight:700;\"><code>git<\u002Fcode><\u002Fspan><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:32px;padding-top:4px;\">\n      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;\">\n          <h3 style=\"margin:0;font-size:16px;font-weight:700;\">From binary<\u002Fh3>\n          <button sc-camel-on-click=\"{{ copyInstall }}\" style=\"all:unset;cursor:pointer;height:30px;padding:0 14px;border-radius:999px;border:1px solid #D6CDBD;display:inline-flex;align-items:center;font-size:13px;font-weight:700;color:#14283C;\" style-hover=\"border-color:#1259A8;color:#1259A8;\">{{ copyLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <pre style=\"margin:0;padding:16px;border:1px solid #E5DED1;border-radius:12px;background:#FBF9F5;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:#14283C;overflow-x:auto;white-space:pre-wrap;word-break:break-all;\"><span style=\"color:#1259A8;font-weight:600;\">curl<\u002Fspan> <span style=\"color:#8A5A00;\">-fsSL<\u002Fspan> <span style=\"color:#4F6B25;\">https://github.com/socrates-tools/socrates/releases/latest/download/install.sh<\u002Fspan> <span style=\"color:#66727F;\">|<\u002Fspan> <span style=\"color:#1259A8;font-weight:600;\">sh<\u002Fspan><\u002Fpre>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#3D4D5E;text-wrap:pretty;\">This installs socrates and all four skills. It checks the download before installing anything, and running it again upgrades everything.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n        <h3 style=\"margin:0;font-size:16px;font-weight:700;\">From source<\u002Fh3>\n        <pre style=\"margin:0;padding:16px;border:1px solid #E5DED1;border-radius:12px;background:#FBF9F5;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:#14283C;overflow-x:auto;\"><span style=\"color:#1259A8;font-weight:600;\">git<\u002Fspan> <span style=\"color:#0B6E79;\">clone<\u002Fspan> <span style=\"color:#4F6B25;\">https://github.com/socrates-tools/socrates<\u002Fspan>\n<span style=\"color:#1259A8;font-weight:600;\">cd<\u002Fspan> socrates\n<span style=\"color:#1259A8;font-weight:600;\">make<\u002Fspan> <span style=\"color:#0B6E79;\">install<\u002Fspan><\u002Fpre>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#3D4D5E;text-wrap:pretty;\">Does the same as the binary install. Needs Go 1.26 or later.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contribute\" data-screen-label=\"Contribute\" style=\"border-top:1px solid #E5DED1;\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(48px,10vw,80px) 20px;display:flex;flex-direction:column;gap:40px;\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;max-width:640px;\">\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;color:#66727F;\">CONTRIBUTE<\u002Fspan>\n      <h2 style=\"margin:0;font-size:clamp(22px,5vw,28px);line-height:1.25;font-weight:700;letter-spacing:-0.02em;\">socrates is open source, and built the way it works<\u002Fh2>\n      <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3D4D5E;text-wrap:pretty;\">Every change here starts as a spec in <code>docs/changes/&lt;slug&gt;/<\u002Fcode>, with its tickets beside it. Run <code>/socrates-design<\u002Fcode> on your idea, or open an issue if you are not sure it needs one.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start;\">\n      <div style=\"padding:24px;border:1px solid #E5DED1;border-radius:12px;background:#FFFFFF;box-shadow:0 1px 2px rgba(20,40,60,0.04),0 12px 32px -12px rgba(20,40,60,0.10);display:flex;flex-direction:column;gap:16px;\">\n        <h3 style=\"margin:0;font-size:16px;font-weight:700;\">Architecture<\u002Fh3>\n        <p style=\"margin:0;font-size:13px;color:#3D4D5E;\">One Go binary. Each namespace is a tool with its own directory.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;border-top:1px solid #E5DED1;\">\n            <div style=\"display:flex;flex-wrap:wrap;column-gap:16px;row-gap:2px;padding:10px 0;border-bottom:1px solid #E5DED1;\"><code style=\"flex:0 0 150px;color:#1259A8;font-weight:600;\">design/<\u002Fcode><span style=\"flex:1 1 200px;font-size:13px;color:#3D4D5E;\">The interview and the spec, and cutting it into tickets.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;column-gap:16px;row-gap:2px;padding:10px 0;border-bottom:1px solid #E5DED1;\"><code style=\"flex:0 0 150px;color:#1259A8;font-weight:600;\">implement/<\u002Fcode><span style=\"flex:1 1 200px;font-size:13px;color:#3D4D5E;\">Builds a change's tickets through implementers.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;column-gap:16px;row-gap:2px;padding:10px 0;border-bottom:1px solid #E5DED1;\"><code style=\"flex:0 0 150px;color:#1259A8;font-weight:600;\">review/<\u002Fcode><span style=\"flex:1 1 200px;font-size:13px;color:#3D4D5E;\">The independent reviewer.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;column-gap:16px;row-gap:2px;padding:10px 0;border-bottom:1px solid #E5DED1;\"><code style=\"flex:0 0 150px;color:#1259A8;font-weight:600;\">agora/<\u002Fcode><span style=\"flex:1 1 200px;font-size:13px;color:#3D4D5E;\">Serves the decisions page and waits for your answer.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;column-gap:16px;row-gap:2px;padding:10px 0;border-bottom:1px solid #E5DED1;\"><code style=\"flex:0 0 150px;color:#1259A8;font-weight:600;\">internal/dispatcher<\u002Fcode><span style=\"flex:1 1 200px;font-size:13px;color:#3D4D5E;\">Routes <code>socrates<\u002Fcode> to each tool.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;color:#3D4D5E;\"><code>AGENTS.md<\u002Fcode> maps the layout and invariants, <code>CONTEXT-MAP.md<\u002Fcode> the vocabulary, and <code>docs/adr/<\u002Fcode> the decisions.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:24px;border:1px solid #E5DED1;border-radius:12px;background:#FFFFFF;box-shadow:0 1px 2px rgba(20,40,60,0.04),0 12px 32px -12px rgba(20,40,60,0.10);display:flex;flex-direction:column;gap:16px;\">\n        <h3 style=\"margin:0;font-size:16px;font-weight:700;\">Run it locally<\u002Fh3>\n        <pre style=\"margin:0;padding:16px;border:1px solid #E5DED1;border-radius:12px;background:#FBF9F5;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:#14283C;overflow-x:auto;\"><span style=\"color:#1259A8;font-weight:600;\">git<\u002Fspan> <span style=\"color:#0B6E79;\">clone<\u002Fspan> <span style=\"color:#4F6B25;\">https://github.com/socrates-tools/socrates<\u002Fspan>\n<span style=\"color:#1259A8;font-weight:600;\">cd<\u002Fspan> socrates\n<span style=\"color:#1259A8;font-weight:600;\">make<\u002Fspan> <span style=\"color:#0B6E79;\">install<\u002Fspan>\n<span style=\"color:#1259A8;font-weight:600;\">make<\u002Fspan> <span style=\"color:#0B6E79;\">verify<\u002Fspan>   <span style=\"color:#66727F;\"># every gate, the same as CI<\u002Fspan><\u002Fpre>\n        <p style=\"margin:0;font-size:13px;color:#3D4D5E;\">Needs Go 1.26 or later, <code>git<\u002Fcode>, and Chrome or Chromium for the page tests. Read <code>CONTRIBUTING.md<\u002Fcode> before opening a pull request.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer style=\"border-top:1px solid #E5DED1;\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:24px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;font-size:13px;color:#66727F;\">\n    <span style=\"display:flex;align-items:center;gap:10px;\"><img src=\"339d8a75-a2c4-4f32-815e-ff8679647be6\" width=\"20\" height=\"20\" alt=\"\" style=\"display:block;flex:none;border-radius:5px;\">MIT licence<\u002Fspan>\n    <nav style=\"display:flex;gap:20px;flex-wrap:wrap;\"><a href=\"https://github.com/socrates-tools/socrates\">GitHub<\u002Fa><a href=\"https://github.com/socrates-tools/socrates/blob/main/CHANGELOG.md\">Changelog<\u002Fa><a href=\"https://github.com/socrates-tools/socrates/blob/main/SECURITY.md\">Security<\u002Fa><\u002Fnav>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showDecisionsPreview&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nconst INSTALL = 'curl -fsSL https://github.com/socrates-tools/socrates/releases/latest/download/install.sh | sh';\n\nclass Component extends DCLogic {\n  state = { copied: false, pick: 0, wide: true };\n  componentDidMount() {\n    this.mq = window.matchMedia('(min-width: 720px)');\n    this.onMq = () => this.setState({ wide: this.mq.matches });\n    this.onMq(); this.mq.addEventListener('change', this.onMq);\n  }\n  copy = () => {\n    navigator.clipboard?.writeText(INSTALL).catch(() => {});\n    this.setState({ copied: true });\n    clearTimeout(this.t); this.t = setTimeout(() => this.setState({ copied: false }), 1600);\n  };\n  componentWillUnmount() { clearTimeout(this.t); this.mq?.removeEventListener(\"change\", this.onMq); }\n  renderVals() {\n    const opts = [\n      { label: 'Keep it for one release', meaning: 'callers get a release to move before it goes', rec: true },\n      { label: 'Remove it now', meaning: 'a smaller change, and a breaking one' },\n    ];\n    return {\n      wide: this.state.wide,\n      narrow: !this.state.wide,\n      showPreview: this.props.showDecisionsPreview ?? true,\n      steps: [\n        { n: 1, title: 'Design', skill: 'socrates-design', when: 'When you have an idea and no spec yet.', body: 'Interviews you over a decisions page until every open question is settled, then writes the spec and its decisions.' },\n        { n: 2, title: 'Tickets', skill: 'socrates-tickets', when: 'Once the spec is committed.', body: 'Cuts the spec into tickets ordered by their blockers, so independent ones can be built in parallel.' },\n        { n: 3, title: 'Implement', skill: 'socrates-implement', when: 'Once the tickets are committed.', body: 'Tickets that don\\u2019t block each other are built in parallel, each in its own worktree, and landed on one branch. Keep talking to it while it works. Nothing is pushed.' },\n        { n: 4, title: 'Review', skill: 'socrates-review', when: 'Before you push.', body: 'A reviewer that did not write the change checks it. Your session fixes what it can and asks you the rest.' },\n      ],\n      previewOptions: opts.map((o, i) => {\n        const on = this.state.pick === i;\n        return { ...o, rec: !!o.rec, pick: () => this.setState({ pick: i }),\n          bg: on ? '#EEF4FB' : '#FFFFFF', border: on ? '#1259A8' : '#E5DED1', ring: on ? '0 0 0 1px #1259A8' : 'none',\n          radio: on ? '5px solid #1259A8' : '1.5px solid #B9AF9E' };\n      }),\n      copyInstall: this.copy,\n      copyLabel: this.state.copied ? 'Copied' : 'Copy',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
